[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c12-hackathon"
version = "0.1.0"
description = "Charge Stability Diagram generator, simulator, and hackathon challenges for a 5-gate DQD platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Stage-1 transformer detectors (detection/). Install with `uv sync --extra train`.
train = ["torch>=2.2"]

[dependency-groups]
# Tooling for contributors to this repo. `uv sync` installs this automatically;
# skip it with `uv sync --no-dev`.
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["csd"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
