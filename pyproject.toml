[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c12-hackathon"
version = "0.1.0"
description = "Charge Stability Diagram generator, simulator, and hackathon challenges for a 5-gate DQD platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Stage-1 transformer detectors (detection/). Install with `uv sync --extra train`.
train = ["torch>=2.2"]

[dependency-groups]
# Tooling for contributors to this repo. `uv sync` installs this automatically;
# skip it with `uv sync --no-dev`.
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
# Fork du hackathon dans hackathon/, notre travail dans challenge1/ et challenge2/.
# L'install editable expose ces paquets au top-level (import csd, detection, ...).
packages = [
    "hackathon/csd",
    "challenge1/detection",
    "challenge2/optimization",
    "challenge2/evaluation",
    "challenge2/training",
    "challenge2/transfer_m5",
]

[tool.pytest.ini_options]
pythonpath = ["hackathon", "challenge1", "challenge2"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
