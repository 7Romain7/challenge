[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csd-hackathon"
version = "0.1.0"
description = "Charge Stability Diagram generator, simulator, and hackathon challenges for a 5-gate DQD platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# The detector stack (challenge 1) is left to participants — install whatever you
# like. This extra is a convenience for those who want PyTorch:
torch = ["torch"]
# Tooling for contributors to this repo:
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["csd"]

[tool.ruff]
line-length = 100
